---
- name: Preparar maquina victima para el Proyecto 11
  hosts: victimas
  become: yes  # Esto le dice que use 'sudo' para instalar cosas
  
  tasks:
    - name: Actualizar los repositorios de la MV
      apt:
        update_cache: yes

    - name: Instalar el servidor web Apache
      apt:
        name: apache2
        state: present

    - name: Asegurar que Apache este encendido y activo
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Permitir el trafico web (Puerto 80) en el cortafuegos
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp
